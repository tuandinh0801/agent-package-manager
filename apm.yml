name: agent-package-manager
version: 1.0.0
description: AI development environment with security rules, coding standards, and
  workflow skills
author: Tuan Dinh
license: MIT
type: hybrid
includes: auto
dependencies:
  apm:
  - JuliusBrussee/caveman#v1.6.0
  - obra/superpowers#f2cbfbe
  - tuandinh0801/hookify-plus#48a8b31
  - pbakaus/impeccable#e587004
  - anthropics/skills#d230a6d
  - thedotmack/claude-mem#9a2818f
  - mattpocock/skills#b843cb5
  mcp:
  - name: io.github.upstash/context7
devDependencies:
  apm: []
scripts:
  deploy-rules: bash scripts/deploy-rules.sh
  deploy-rules-global: bash scripts/deploy-rules.sh --global
compilation:
  strategy: distributed
  source_attribution: true
  exclude:
  - apm_modules/**
  - docs/**
  placement:
    min_instructions_per_file: 1
