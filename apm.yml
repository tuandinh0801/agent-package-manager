name: agent-package-manager
version: 1.0.0
description: AI development environment with security rules, coding standards, and workflow skills
author: Tuan Dinh
license: MIT
type: hybrid

includes: auto

dependencies:
  apm:
    # Token-compressed communication
    - JuliusBrussee/caveman
    # Development workflows (TDD, debugging, brainstorming, verification)
    - obra/superpowers
    # Security rule enforcement engine
    - anthropics/claude-plugins-official/plugins/hookify
    # Structured PR review
    - anthropics/claude-plugins-official/plugins/pr-review-toolkit
    # UI/UX design polish and critique
    - pbakaus/impeccable
    # Document generation (PDF, PPTX, DOCX, XLSX)
    - anthropics/skills
    # Persistent cross-session memory
    - thedotmack/claude-mem
  mcp: []

devDependencies:
  apm: []

scripts: {}

compilation:
  strategy: distributed
  source_attribution: true
  exclude:
    - "apm_modules/**"
    - "docs/**"
  placement:
    min_instructions_per_file: 1
