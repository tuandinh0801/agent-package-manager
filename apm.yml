name: agent-package-manager
version: 1.0.0
description: AI development environment with security rules, coding standards, and
  workflow skills
author: Tuan Dinh
license: MIT
type: hybrid
includes: auto
dependencies:
  apm:
  - JuliusBrussee/caveman#v1.6.0
  - obra/superpowers
  - tuandinh0801/hookify-plus
  - pbakaus/impeccable
  - anthropics/skills
  - thedotmack/claude-mem
  - mattpocock/skills
  mcp:
  - name: io.github.upstash/context7
devDependencies:
  apm: []
scripts: {}
compilation:
  strategy: distributed
  source_attribution: true
  exclude:
  - apm_modules/**
  - docs/**
  placement:
    min_instructions_per_file: 1
